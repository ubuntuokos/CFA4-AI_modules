name: CFA4 security scanning

# Stage 2 of the CFA4 quality and security gate.
# - Semgrep: CFA4 project rules in .semgrep/ (blocking, non-compiling, every PR).
# - CodeQL: python and GitHub Actions on every PR (no build); Rust on main, weekly,
#   manually or with the `cfa4-full-validation` label, because the Rust extractor
#   analyses the whole 400k-line workspace (AGENTS.md: automatic PR checks stay quick).
# - OSV-Scanner: lockfile-based vulnerability report for every ecosystem (report-only;
#   the blocking Rust advisory check is cargo-deny in cfa4-gate.yml).
# Results go to GitHub code scanning (Security tab and PR annotations) as SARIF.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"   # weekly full scan
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfa4-security-${{ github.ref }}
  cancel-in-progress: true

env:
  SEMGREP_VERSION: "1.183.0"

jobs:
  semgrep:
    name: Semgrep (CFA4 rules)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install Semgrep
        run: python -m pip install "semgrep==${SEMGREP_VERSION}"
      - name: Scan
        run: semgrep scan --metrics=off --config .semgrep/ --error --sarif-output=semgrep.sarif
      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialise CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyse
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  codeql-rust:
    name: CodeQL (rust)
    if: github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'cfa4-full-validation')
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Initialise CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: rust
          build-mode: none
          queries: security-extended
      - name: Analyse
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:rust"

  osv:
    name: OSV-Scanner (report-only)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan lockfiles
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            ./
