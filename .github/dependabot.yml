version: 2
# Supply-chain hygiene: version updates wait 7 days after a release, so a hijacked
# or yanked release is usually caught before it reaches a PR. Security updates are
# not delayed by cooldown.
updates:
  # Maintain Rust / Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    # Consolidate updates into a single PR rather than one PR per crate
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
    cooldown:
      default-days: 7

  # Python developer tooling (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-devtools:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(python)"
    cooldown:
      default-days: 7

